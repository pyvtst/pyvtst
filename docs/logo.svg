    <path stroke="#0A9396" d="M16 128 C40 128 44 40 70 40 C96 40 120 128 144 128"/>
    <path stroke="#EE9B00" d="M16 128 C40 128 56 60 82 60 C108 60 120 128 144 128"/>
    <path stroke="#AE2012" d="M16 128 C40 128 68 80 94 80 C120 80 120 128 144 128"/>
  </g>
  <circle class="dot" stroke="#0A9396" cx="70" cy="40" r="5"/>
  <circle class="dot" stroke="#EE9B00" cx="82" cy="60" r="5"/>
  <circle class="dot" stroke="#AE2012" cx="94" cy="80" r="5"/>

  <!-- Wordmark -->
  <text x="160" y="98" font-size="52" font-weight="700" letter-spacing="-1" class="ink">PyVTST</text>
</svg>
