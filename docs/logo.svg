<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160" role="img" aria-labelledby="t">
  <title id="t">PyVTST</title>
  <style>
    .ink   { fill: #22223B; }
    .dot   { fill: #22223B; }
    text { font-family: "JetBrains Mono", "Fira Code", "Source Code Pro", Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .ink, .dot { fill: #ECEAF4; }
    }
  </style>

  <!-- Mark: ΔG(T, s) along the reaction path at three temperatures (cold → hot).
       CVT places the dividing surface at each curve's maximum, which moves with T. -->
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <path stroke="#2C7DA0" d="M16 128 C40 128 44 40 70 40 C96 40 120 128 144 128"/>
    <path stroke="#7A5C9E" d="M16 128 C40 128 56 60 82 60 C108 60 120 128 144 128"/>
    <path stroke="#D1495B" d="M16 128 C40 128 68 80 94 80 C120 80 120 128 144 128"/>
  </g>
  <circle class="dot" cx="70" cy="40" r="5"/>
  <circle class="dot" cx="82" cy="60" r="5"/>
  <circle class="dot" cx="94" cy="80" r="5"/>

  <!-- Wordmark -->
  <text x="160" y="98" font-size="52" font-weight="700" letter-spacing="-1" class="ink">PyVTST</text>
</svg>
