name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # h5py (a PySCF dependency) has no Python 3.15 wheel yet, so it is built
      # from source there and needs the HDF5 headers and library.
      - name: Install HDF5 for the h5py source build
        if: matrix.python-version == '3.15'
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev pkg-config
      - name: Install with all extras
        run: uv sync --locked --all-extras
      - name: Lint
        run: |
          uv run ruff check
          uv run ruff format --check
      - name: Type-check
        run: uv run mypy
      - name: Check import contracts
        run: uv run lint-imports
      - name: Run tests
        run: uv run pytest --cov-fail-under=90
