[project]
name = "pyvtst"
version = "0.1.0.dev0"
description = "Thermal rate constants for gas-phase reactions from conventional and variational transition state theory with tunneling corrections."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Emilian R" }]
keywords = ["chemistry", "kinetics", "transition state theory", "VTST", "tunneling"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
ase = ["ase>=3.22"]
geometric = ["geometric>=1.1"]
hdf5 = ["h5py>=3.8"]
plot = ["matplotlib>=3.7"]
pyscf = ["pyscf>=2.4"]
rdkit = ["rdkit>=2023.9"]

[dependency-groups]
dev = [
    "bandit[toml]>=1.9.4",
    "geometric>=1.1",
    "import-linter>=2.15",
    "mypy>=2.4.1",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "scipy-stubs>=1.15.3.0",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Slow tests (published-reference validation, needs PySCF) run only with -m slow.
addopts = ["--cov", "--cov-report=term-missing", "-m", "not slow"]
markers = ["slow: long-running validation against published results; run with -m slow"]

[tool.coverage.run]
source_pkgs = ["pyvtst"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "C4",      # comprehensions
    "NPY",     # numpy
    "PT",      # pytest style
    "RUF",
    "PLC0415", # imports inside functions need an explicit noqa
]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
warn_unreachable = true
# ASE ships py.typed but many of its methods are unannotated.
untyped_calls_exclude = ["ase"]

# PySCF, geomeTRIC and h5py ship no type information.
[[tool.mypy.overrides]]
module = ["pyscf.*", "geometric.*", "h5py.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.importlinter]
root_package = "pyvtst"
include_external_packages = true
exclude_type_checking_imports = true

# Hexagonal layering. Adapter packages (io, engines, optimizers, stores) and
# the plot module sit above ports, which sit above core; adapters do not
# import each other.
# Parenthesised layers are optional, so planned packages can be listed now.
[[tool.importlinter.contracts]]
name = "Hexagonal layers"
type = "layers"
containers = ["pyvtst"]
layers = [
    "(reaction)",
    "io | (engines) | (optimizers) | (stores) | plot",
    "(ports)",
    "core",
]

[[tool.importlinter.contracts]]
name = "Core and ports use only numpy and scipy"
type = "forbidden"
source_modules = ["pyvtst.core", "pyvtst.ports"]
forbidden_modules = ["ase", "rdkit", "pyscf", "geometric", "h5py", "matplotlib"]
